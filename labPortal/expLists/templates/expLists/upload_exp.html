{% extends 'expLists/base.html' %}
{% load static %}
{% load bootstrap_icons %}

{% block title %} Lab Portal | Upload Exp Lists {% endblock %}

{% block content %}
<!-- Intro section start -->
<section id="upload-exp-lists">
    <div class="container-lg">
        <div class="row justify-content-center align-items-center">
            <div class="col-md-3 text-center text-md-start">
                <h1>
                    <div class="display-6">Upload Exp Lists</div>                                        
                </h1>
            </div>
        </div>
    </div>

    <div class="container-lg mt-3">
        <div class="row justify-content-center align-items-center">
            <div class="col-md-8 text-center text-md-start">       
                
                <fieldset class="border rounded-3 px-4 py-4">
                    <form action="{% url 'upload-exp' %}" method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                
                        {{ form.as_p }}

                        <div class="d-grid gap-2">
                            <button class="btn btn-secondary" type="submit">Submit</button>                            
                        </div>                 
                    </form>
                </fieldset>
            </div>
        </div>
    </div>     
</section>      
    
{% endblock %}    
    
</body>
</html>
